# Flatpak build of Nibform from this checkout:
#   flatpak-builder --user --install --force-clean build-flatpak packaging/flatpak/io.github.vilkasek.Nibform.yml
# For Flathub the last source becomes a git tag instead of the local directory.
id: io.github.vilkasek.Nibform
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: nibform
finish-args:
  # OpenCASCADE's viewer needs GLX, so the app runs on X11 (XWayland on Wayland).
  - --socket=x11
  - --share=ipc
  - --device=dri
  # Projects live anywhere in home; recent files keep their real paths.
  - --filesystem=home
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/eigen3
  - /share/doc
  - '*.a'
modules:
  - name: eigen
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DBUILD_TESTING=OFF
      - -DEIGEN_BUILD_DOC=OFF
    sources:
      - type: archive
        url: https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz
        sha256: 8586084f71f9bde545ee7fa6d00288b264a2b7ac3607b974e54d13e7162c1c72

  - name: opencascade
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_LIBRARY_TYPE=Shared
      - -DINSTALL_DIR_LAYOUT=Unix
      - -DBUILD_MODULE_Draw=OFF
      - -DBUILD_DOC_Overview=OFF
      - -DUSE_TK=OFF
      - -DUSE_FREEIMAGE=OFF
      - -DUSE_RAPIDJSON=OFF
      - -DUSE_DRACO=OFF
      - -DUSE_TBB=OFF
      - -DUSE_VTK=OFF
      - -DUSE_FFMPEG=OFF
      - -DUSE_OPENVR=OFF
    cleanup:
      - /bin
      - /share/opencascade/samples
    sources:
      - type: archive
        url: https://github.com/Open-Cascade-SAS/OCCT/archive/refs/tags/V7_9_3.tar.gz
        sha256: 5ecf094ec6b12d5413dfb851d8c3590c354058aee556e32e408bdfbf8c357d57

  - name: nibform
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DNIBFORM_BUILD_TESTS=OFF
    sources:
      - type: dir
        path: ../..
        skip:
          - build
          - build-flatpak
          - .flatpak-builder
